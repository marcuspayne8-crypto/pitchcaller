<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0c0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SL Pitch">
<title>Salt Lake Phantoms Pitch Caller</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="version.js"></script>
<style>
  /* Yellowtail (c) 2011 Brian J. Bonislawsky, Apache 2.0. See fonts/LICENSE. */
  @font-face {
    font-family: "Yellowtail";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("fonts/yellowtail-latin.woff2") format("woff2");
  }
  :root{
    --bg:#0B0B0B;
    --surface:#1A1A1A;
    --border:#4A4A4A;
    --text:#F5F5F5;
    --muted:#C8C8C8;
    --orange:#FF8500;
    --ink:#0B0B0B;
    --live:#C41010;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
  html,body{
    margin:0; background:var(--bg); color:var(--text);
    height:100vh;
    height:100dvh;
    max-height:100dvh;
    overflow:hidden;
  }
  body{
    display:grid;
    grid-template-rows:minmax(0,1fr);
    padding:
      env(safe-area-inset-top)
      env(safe-area-inset-right)
      env(safe-area-inset-bottom)
      env(safe-area-inset-left);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  button,input,.pitch,.loc{touch-action:manipulation;}
  button{
    font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); cursor:pointer; touch-action:manipulation;
  }
  #screen{
    position:relative;
    min-height:0; height:100%;
    display:grid;
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:44px 88px minmax(0,1fr) 28px 56px 8px 100px;
    gap:6px;
    padding:4px 8px 6px;
  }
  #board,#dock{display:contents;}
  header,#pitchBox,#locBox,#callStatus,#sendRow,#outLevel,#talkSlot{min-height:0;}
  header{
    display:flex; align-items:center; gap:8px; min-width:0; height:44px; overflow:hidden;
  }
  .mark{display:none;}
  h1{
    margin:0; min-width:0; flex:1 1 auto;
    font-family:"Yellowtail","Segoe Script","Brush Script MT",cursive;
    font-size:clamp(20px, 6.2vw, 32px); font-weight:400; line-height:1;
    color:#fff; white-space:nowrap; overflow:hidden;
    -webkit-text-stroke:1.15px var(--orange); paint-order:stroke fill;
  }
  #msgBtn{
    height:32px; flex:none; border-radius:10px; padding:0 8px;
    display:flex; align-items:center; gap:4px;
    background:var(--surface); color:var(--orange); border:1px solid var(--orange);
    font-weight:800; font-size:13px;
  }
  #msgBtn svg{display:block; flex:none;}
  #msgBtn .msgFull{display:none;}
  #msgBtn.has{background:var(--orange); color:var(--ink);}
  #msgBtn.has svg{fill:var(--ink);}
  #appVersion{font-size:11px; font-weight:800; color:var(--muted); letter-spacing:0.04em; flex:none;}
  #updateBtn{
    flex:none; max-width:72px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:10px; font-weight:750; padding:2px 6px; border-radius:999px;
    background:transparent; color:var(--orange); border:1px solid var(--orange);
  }
  #settingsBtn{
    width:34px; height:34px; flex:none; padding:0; border-radius:50%;
    display:grid; place-items:center; background:transparent; color:var(--text);
    border:1px solid var(--border);
  }
  #settingsBtn svg{display:block;}
  #pitchBox,#locBox{min-height:0; min-width:0; overflow:hidden;}
  #pitches{
    height:100%; min-height:0;
    display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px;
  }
  .pitch{
    min-height:0; height:100%; padding:4px 3px;
    background:var(--surface); color:var(--text); border:1px solid var(--border);
    font-size:clamp(11px, 3vw, 16px); font-weight:750; line-height:1.05; text-align:center;
    display:flex; align-items:center; justify-content:center;
    white-space:normal; overflow:hidden; border-radius:14px;
  }
  #locGrid{
    height:100%; min-height:0;
    display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); grid-template-rows:repeat(3, minmax(0,1fr));
    gap:8px;
  }
  .loc{
    min-height:0; height:100%; padding:2px;
    background:var(--surface); color:var(--text); border:1px solid var(--border);
    font-size:clamp(12px, 3.1vw, 18px); font-weight:750; line-height:1.05; text-align:center;
    display:flex; align-items:center; justify-content:center;
    white-space:nowrap; overflow:hidden; border-radius:14px;
  }
  .locFull{display:none;}
  .locShort{display:inline;}
  .sel{
    background:var(--orange)!important; color:var(--ink)!important; font-weight:800;
    border-color:var(--orange)!important; box-shadow:0 0 0 2px var(--text);
  }
  #callStatus{
    height:28px; min-height:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:750; color:var(--text); letter-spacing:-0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px;
  }
  #callStatus.err{color:#ffb4a8;}
  #sendRow{display:grid; grid-template-columns:minmax(72px,1fr) minmax(200px,2.4fr); gap:8px; min-height:0;}
  #clearBtn,#sendBtn{height:56px; min-height:56px; border-radius:14px; font-weight:800;}
  #clearBtn{background:var(--surface); color:var(--text); border:1px solid var(--border); font-size:16px;}
  #sendBtn{background:var(--orange); color:var(--ink); border-color:var(--orange); font-size:clamp(20px, 5vw, 28px); letter-spacing:0.08em;}
  #sendBtn:disabled{background:#2A2A2A; color:#B0B0B0; border-color:#2A2A2A; box-shadow:none;}
  #sendBtn.playing{background:#fff; color:var(--ink);}
  #outLevel{height:8px; min-height:8px; display:flex; align-items:center;}
  #outMeter{flex:1; height:8px; border-radius:99px; background:#2A2A2A; overflow:hidden;}
  #outMeterBar{display:block; height:100%; width:0; background:var(--orange);}
  #talkSlot{min-height:0; display:flex; align-items:flex-end; padding-top:12px;}
  #talkBtn{
    width:100%; height:84px; min-height:84px; max-height:84px;
    background:#1A1A1A; color:#FF8500; border-radius:18px;
    box-shadow:inset 0 0 0 3px #FF8500; border:0;
    font-size:clamp(16px, 4.4vw, 22px); font-weight:800; letter-spacing:0.08em;
    display:flex; align-items:center; justify-content:center;
    transform:none; transition:none; position:relative;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  #talkBtnLabel{line-height:1; white-space:nowrap;}
  #talkLive{display:none !important;}
  #talkBtn.holding, #talkBtn.holding:active{
    background:#FF8500; color:#0B0B0B;
    box-shadow:inset 0 6px 16px rgba(0,0,0,.35);
    transform:scale(0.97);
  }
  #talkBtn.live, #talkBtn.live:active{
    background:#C41010; color:#fff; font-weight:800;
    box-shadow:none; transform:scale(0.97);
  }
  #talkBtn.live::after{
    content:""; position:absolute; inset:-4px; border-radius:22px;
    border:4px solid #FF3B30; pointer-events:none;
    animation:talkRing 1.2s ease-out infinite;
  }
  @keyframes talkRing{
    0%{opacity:1; transform:scale(1);}
    100%{opacity:0; transform:scale(1.04);}
  }
  #txBanner,#micBanner{
    position:absolute; left:8px; right:8px; top:48px; z-index:6; height:28px;
    display:flex; align-items:center; justify-content:center;
    background:#C41010; color:#fff; font-size:13px; font-weight:800; letter-spacing:0.14em;
    border-radius:8px; pointer-events:none;
  }
  #micBanner{background:#1A1A1A; color:#FF8500; border:1px solid #FF8500;}
  #txBanner[hidden],#micBanner[hidden],#toast[hidden]{display:none !important;}
  #toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%);
    z-index:40; max-width:calc(100% - 32px);
    background:#FF8500; color:#0B0B0B; font-weight:800; font-size:15px;
    padding:10px 16px; border-radius:999px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  body.flash::after{
    content:""; position:fixed; inset:0; z-index:23; pointer-events:none;
    background:rgba(255,133,0,.38);
  }
  #msgSheet{
    position:fixed; inset:0; z-index:25;
    display:flex; align-items:flex-end; justify-content:center;
    background:rgba(0,0,0,0); visibility:hidden; pointer-events:none;
  }
  #msgSheet.open{background:rgba(0,0,0,.62); visibility:visible; pointer-events:auto;}
  #msgPanel{
    width:min(560px, 100%);
    max-height:92dvh;
    background:#1A1A1A; color:var(--text);
    border-radius:24px 24px 0 0;
    padding:8px 16px calc(16px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:12px;
    transform:translateY(105%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -16px 40px rgba(0,0,0,.45);
  }
  #msgSheet.open #msgPanel{transform:translateY(0);}
  #msgPanel{overflow:auto; -webkit-overflow-scrolling:touch;}
  .sheetHead{
    position:sticky; top:0; z-index:3;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:#f4f4f6; padding:4px 0 8px;
  }
  .sheetHead h2{margin:0; font-size:20px; font-weight:800;}
  .sheetX{
    height:36px; min-width:64px; padding:0 12px; border-radius:999px;
    background:#fff; color:#17171a; border:1px solid #d9d9e0; font-weight:800; font-size:14px;
  }
  #msgPanel .sheetHead{background:#1A1A1A; margin:0 -16px; padding:4px 16px 8px;}
  #msgPanel .sheetHead h2{color:#F5F5F5; font-size:20px;}
  #msgPanel .sheetX{background:#2A2A2A; color:#F5F5F5; border-color:#4A4A4A;}
  .group{display:flex; flex-direction:column; gap:4px;}
  .group h3{
    margin:6px 0 0; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#5e5e68;
  }
  #updateNow{background:#17171a; color:#fff; border-color:#17171a;}
  #msgPanel .handle{background:#4A4A4A;}
  #composer{display:flex; flex-direction:column; gap:8px;}
  #msgRow{display:flex; align-items:center; gap:8px;}
  #customMsg{
    flex:1; min-width:0; height:48px; border:1px solid var(--border); border-radius:12px;
    background:#0B0B0B; color:#fff; padding:0 12px; font:inherit; font-size:16px;
    user-select:text; -webkit-user-select:text; touch-action:manipulation;
  }
  #customMsg::placeholder{color:#C8C8C8;}
  #msgClear,#recBtn,#noteDelete{
    width:48px; height:48px; flex:none; padding:0; border-radius:12px;
    display:grid; place-items:center; background:#2A2A2A; color:#F5F5F5; border:1px solid var(--border);
  }
  #msgClear[hidden],#recLive[hidden],#noteRow[hidden]{display:none !important;}
  #recBtn.rec{background:#C41010; color:#fff; border-color:#C41010;}
  #recLive,#noteRow{display:flex; align-items:center; gap:8px; min-height:28px; font-size:14px; font-weight:750;}
  .recDot{width:8px; height:8px; border-radius:50%; background:#C41010; flex:none;}
  #recMeter{flex:1; max-width:160px; height:8px; border-radius:99px; background:#2A2A2A; overflow:hidden;}
  #recMeterBar{display:block; height:100%; width:0; background:var(--orange);}
  #notePlay,#noteDelete{width:36px; height:36px; border-radius:10px;}
  #msgActions{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  #msgActions button{height:48px; font-weight:800; font-size:14px;}
  #addMsg{background:#2A2A2A; color:#F5F5F5; border:1px solid var(--border);}
  #sendMsgNow{background:var(--orange); color:var(--ink); border-color:var(--orange);}
  #sendMsgNow:disabled{background:#2A2A2A; color:#B0B0B0; border-color:#2A2A2A;}
  #voiceBar{
    display:flex; gap:6px; overflow-x:auto; flex-wrap:nowrap; padding-bottom:2px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  #voiceBar::-webkit-scrollbar{display:none;}
  .voicePill{
    flex:none; padding:6px 8px; border-radius:999px; font-size:12px; font-weight:750;
    background:#fff; color:#17171a; border:1px solid #d9d9e0;
  }
  .voicePill.on{background:var(--orange); color:var(--ink); border-color:var(--orange);}
  #settings{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:flex-end; justify-content:center;
    background:rgba(0,0,0,0); visibility:hidden; pointer-events:none;
    transition:background .28s ease, visibility .28s;
  }
  #settings.open{background:rgba(0,0,0,.62); visibility:visible; pointer-events:auto;}
  .sheet{
    background:#f4f4f6; color:#17171a;
    border-radius:28px 28px 0 0;
    padding:6px 16px calc(12px + env(safe-area-inset-bottom));
    width:min(560px, 100%);
    max-height:min(92dvh, 760px);
    overflow:auto;
    display:flex; flex-direction:column; gap:6px;
    transform:translateY(105%);
    transition:transform .32s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -16px 50px rgba(0,0,0,.4);
    user-select:text; -webkit-user-select:text;
  }
  #settings.open .sheet{transform:translateY(0);}
  .handle{width:42px; height:5px; border-radius:99px; background:#c9c9d0; margin:6px auto 2px; flex:none;}
  .sheet h2{margin:0; font-size:22px; font-weight:750; letter-spacing:-0.02em;}
  .row{display:flex; flex-direction:column; gap:2px;}
  .row label{font-weight:700; font-size:14px;}
  .split{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row .hint{font-size:13px; color:#5e5e68; line-height:1.4;}
  .seg{display:flex; gap:8px;}
  .sheet button{background:#fff; color:#17171a; border:1px solid #d9d9e0; border-radius:14px; font-weight:700;}
  .seg button{flex:1; padding:8px; font-size:14px;}
  .sheet .sel{background:var(--orange)!important; color:var(--ink)!important; border-color:var(--orange)!important; box-shadow:none;}
  input[type=range]{width:100%; height:22px; accent-color:var(--orange); margin:0;}
  .sheetBtns{display:flex; gap:10px; flex-wrap:wrap;}
  .sheetBtns button{flex:1; padding:10px; font-size:15px;}
  #closeSettings{background:var(--orange); color:var(--ink); border-color:var(--orange);}
  .toggle{display:flex; align-items:center; gap:10px; font-weight:700;}
  .toggle input{width:24px; height:24px; accent-color:var(--orange);}
  select{
    font:inherit; font-size:15px; height:36px; border-radius:10px;
    border:1px solid #d9d9e0; background:#fff; color:#17171a; padding:0 10px;
  }
  @media (min-width: 768px) and (orientation: portrait){
    body{padding:20px;}
    #screen{width:min(600px, 100%); margin:0 auto; padding:0;}
    .loc{font-size:16px;}
    .locFull{display:inline;}
    .locShort{display:none;}
    .mark{display:block; width:36px; height:36px; flex:none; border-radius:50%;}
    h1{font-size:clamp(22px, 3vw, 34px);}
    #msgBtn .msgShort{display:none;}
    #msgBtn .msgFull{display:inline;}
  }
  @media (min-width: 900px) and (min-height: 600px) and (orientation: landscape){
    body{padding:20px;}
    #screen{
      width:100%; max-width:none; margin:0;
      grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);
      grid-template-rows:44px minmax(0,1fr);
      gap:16px 20px;
      padding:0;
    }
    header{grid-column:1 / -1; grid-row:1;}
    #board{
      display:grid; grid-column:1; grid-row:2;
      grid-template-rows:96px minmax(0,1fr); gap:12px; min-height:0;
    }
    #dock{
      display:grid; grid-column:2; grid-row:2; align-self:end; min-height:0;
      grid-template-rows:28px 56px 8px 100px; gap:8px;
    }
    .pitch{font-size:18px;}
    .loc{font-size:16px;}
    .mark{display:block; width:36px; height:36px; flex:none; border-radius:50%;}
    #msgBtn .msgShort{display:none;}
    #msgBtn .msgFull{display:inline;}
    .locFull{display:inline;}
    .locShort{display:none;}
    #txBanner,#micBanner{top:52px; left:0; right:auto; width:42%;}
  }

</style>
</head>
<body>
<div id="toast" hidden></div>
<div id="screen">
  <div id="txBanner" hidden>LIVE TO CATCHER</div>
  <div id="micBanner" hidden>MIC OFF</div>
  <header>
    <img class="mark" src="icons/sl-logo.png" width="64" height="64" alt="">
    <h1>Salt Lake Phantoms</h1>
    <span id="appVersion"></span>
    <button type="button" id="msgBtn" aria-label="Message">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
      <span class="msgShort">Msg</span><span class="msgFull">Message</span>
    </button>
    <button type="button" id="updateBtn" hidden>Update</button>
    <button type="button" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M19.14 12.94a7.5 7.5 0 0 0 .05-.94 7.5 7.5 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.3 7.3 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0-.05.94 7.5 7.5 0 0 0 .05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.04.71 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.23 1.13-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
      </svg>
    </button>
  </header>
  <div id="board">
    <section id="pitchBox"><div id="pitches"></div></section>
    <section id="locBox"><div id="locGrid"></div></section>
  </div>
  <div id="dock">
    <div id="callStatus">Select a pitch</div>
    <div id="sendRow">
      <button type="button" id="clearBtn">Clear</button>
      <button type="button" id="sendBtn" disabled>SEND</button>
    </div>
    <div id="outLevel" aria-hidden="true"><span id="outMeter"><span id="outMeterBar"></span></span></div>
    <div id="talkSlot">
      <button type="button" id="talkBtn" aria-pressed="false">
        <span id="talkBtnLabel">HOLD TO TALK</span>
        <span id="talkLive" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</div>

<div id="msgSheet" role="dialog" aria-modal="true" aria-labelledby="msgTitle">
  <div id="msgPanel">
    <div class="sheetHead">
      <h2 id="msgTitle">Message</h2>
      <button type="button" class="sheetX" id="closeMsg" aria-label="Close">Done</button>
    </div>
    <div id="composer">
      <div id="msgRow">
        <input id="customMsg" type="text" inputmode="text" enterkeyhint="done" maxlength="160" autocomplete="off" autocapitalize="sentences" placeholder="Custom message" aria-label="Custom message">
        <button type="button" id="msgClear" aria-label="Clear message" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
        </button>
        <button type="button" id="recBtn" aria-label="Record voice note" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        </button>
      </div>
      <div id="recLive" hidden><span class="recDot" aria-hidden="true"></span><span id="recTime">0:00</span><span id="recMeter" aria-hidden="true"><span id="recMeterBar"></span></span></div>
      <div id="noteRow" hidden>
        <span id="noteText">Voice note</span>
        <button type="button" id="notePlay" aria-label="Play voice note">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        </button>
        <button type="button" id="noteDelete" aria-label="Delete voice note">

<script>
(function(){
  "use strict";
  var PITCHES = [
    {id:"fastball", label:"Fastball", say:"Fastball"},
    {id:"curveball", label:"Curveball", say:"Curveball"},
    {id:"changeup", label:"Changeup", say:"Change up"},
    {id:"splitfinger", label:"Split-Finger", say:"Split finger"}
  ];
  var ROWS = ["high","middle","low"];
  var COLS = ["inside","middle","outside"];
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
  function locLabel(r,c){ return cap(r)+" "+cap(c); }

    var row = r==="high" ? "High" : r==="low" ? "Low" : "Mid";
    var col = c==="inside" ? "In" : c==="outside" ? "Out" : "Mid";
    if(r==="middle" && c==="middle") return "Middle";

  }

  var CLIP_VOICES = [
    {id:"marcus", label:"Coach Marcus"},
    {id:"narrator", label:"The Narrator"},
    {id:"announcer", label:"Announcer"},
    {id:"calm", label:"Calm"},
    {id:"cowboy", label:"Cowboy"}
  ];
  var VERSION = (typeof PITCHCALLER_VERSION === "string" && PITCHCALLER_VERSION) ? PITCHCALLER_VERSION : "v2.5";
  var DEFAULTS = {prerollType:"noise", prerollLen:300, prerollLevel:12, gap:120, vol:100, repeat:false, wake:true, voiceURI:"", speechRate:1, clipVoice:"marcus", talkBeep:false, talkToggle:false};

  try { Object.assign(settings, JSON.parse(localStorage.getItem("pc-settings")||"{}")); } catch(e){}

  if (typeof settings.speechRate !== "number" || !isFinite(settings.speechRate)) settings.speechRate = 1;
  settings.speechRate = Math.min(1.3, Math.max(0.7, Math.round(settings.speechRate * 10) / 10));
  if (typeof settings.voiceURI !== "string") settings.voiceURI = "";
  if (!CLIP_VOICES.some(function(v){ return v.id === settings.clipVoice; })) settings.clipVoice = "marcus";

  var state = {pitch:null, loc:null, playing:false, note:null};
  var ctx = null, buffers = {}, clipRaw = {}, clipUrl = {}, loaded = false, loadError = null;
  var routeDirty = false;
  var REC_MAX = 15;
  var rec = {active:false, starting:false, cancelStart:false, pendingStop:false, discard:false, startedAt:0, stream:null, recorder:null, chunks:[], timer:null, mode:"", mime:"", wavCtx:null, wavProc:null, wavSource:null, wavChunks:null};
  var $ = function(id){return document.getElementById(id);};
  var statusEl = $("callStatus");

    statusEl.className = err ? "err" : "";

    }
  }

  // ---------- Build UI ----------
  var pitchBtns = {};

    });

  });
  var locBtns = {};
  var g = $("locGrid");
  ROWS.forEach(function(r){
    COLS.forEach(function(c){
      var id = r+"-"+c, b = document.createElement("button");

      var full=document.createElement("span"); full.className="locFull"; full.textContent=locLabel(r,c);
      var brief=document.createElement("span"); brief.className="locShort"; brief.textContent=locShort(r,c);

      b.addEventListener("click", function(){ state.loc = (state.loc===id) ? null : id; render(); });

    });
  });

  function callText(p, l){

    if(l){ var rc=l.split("-"); t += ", " + locLabel(rc[0],rc[1]); }
    return t;
  }
  function messageText(){ return ($("customMsg").value || "").replace(/\s+/g, " ").trim(); }

    $("customMsg").value = "";

  }
  function noteLabel(note){ return note ? "[voice note " + note.secs + "s]" : ""; }

    var parts = [];

    if(state.note) parts.push(noteLabel(state.note));

  }
  function readyLine(p, l){
    if(!p) return "";

  }
  function callStatusText(){

  function render(){

    sb.textContent = state.playing ? "SENDING" : "SEND";
    sb.classList.toggle("playing", state.playing);
    var nowBtn = $("sendMsgNow");
    if(nowBtn) nowBtn.disabled = state.playing || rec.active || !(messageText() || state.note);

    $("noteRow").hidden = !state.note;
    var aa = $("msgBtn");

      var noteLabelText = "Voice note " + state.note.secs + "s";

  }

  // ---------- Audio ----------
  function clipNames(){ var n = PITCHES.map(function(p){return p.id;}); ROWS.forEach(function(r){COLS.forEach(function(c){n.push(r+"-"+c);});}); return n; }
  function b64ToArrayBuffer(b64){ var bin=atob(b64), len=bin.length, u=new Uint8Array(len); for(var i=0;i<len;i++)u[i]=bin.charCodeAt(i); return u.buffer; }
  function clipFile(voice, name){

  function getClipData(name){
    if(window.EMBEDDED_CLIPS && window.EMBEDDED_CLIPS[name]) return Promise.resolve(b64ToArrayBuffer(window.EMBEDDED_CLIPS[name]));

  }
  var voicePacks = {};
  function ensureVoice(id){

    if(pack.loaded) return Promise.resolve(pack);

    pack.promise = Promise.all(names.map(function(n){
      return fetch(clipFile(id, n)).then(function(r){
        if(!r.ok) throw new Error(n+" "+r.status);
        return r.arrayBuffer();
      }).then(function(ab){
        var copy = ab.slice(0);

        if(pack.url[n]){ try{ URL.revokeObjectURL(pack.url[n]); }catch(e){} }

        return decode(ab.slice(0)).then(function(b){ pack.buffers[n] = b; });

  }
  function applyVoicePack(pack){
    clipRaw = pack.raw;
    clipUrl = pack.url;
    buffers = pack.buffers;
    loaded = true;
    loadError = null;
  }
  function selectClipVoice(id){
    if(!CLIP_VOICES.some(function(v){ return v.id === id; })) id = "marcus";
    var label = "Coach Marcus";
    CLIP_VOICES.forEach(function(v){ if(v.id === id) label = v.label; });
    settings.clipVoice = id;
    save();
    syncVoiceUI();
    if(voicePacks[id] && voicePacks[id].loaded){ applyVoicePack(voicePacks[id]); setStatus("Ready - " + label); render(); return Promise.resolve(); }
    setStatus("Loading " + label + "...");
    return ensureVoice(id).then(function(pack){
      if(settings.clipVoice !== id) return;
      applyVoicePack(pack);
      setStatus("Ready - " + label);
      render();
    }).catch(function(e){
      loadError = e;
      setStatus("Could not load clips: " + e.message, true);
      render();
    });
  }
  function syncVoiceUI(){
    var id = settings.clipVoice || "marcus";
    Array.prototype.forEach.call(document.querySelectorAll(".voicePill"), function(b){
      var on = b.dataset.voice === id;
      b.classList.toggle("on", on);
      b.setAttribute("aria-checked", on ? "true" : "false");
    });
    var sel = $("clipVoiceSel");
    if(sel) sel.value = id;
    var current = document.querySelector(".voicePill.on");
    if(current && current.scrollIntoView) current.scrollIntoView({inline:"nearest", block:"nearest"});
  }
  function decode(ab){ return new Promise(function(res,rej){ var p = ctx.decodeAudioData(ab, res, rej); if(p && p.then) p.then(res,rej); }); }

  function ensureCtx(){
    createCtx();
    if(ctx.state !== "running") ctx.resume();
    return ctx;
  }
  function createCtx(){
    if(!ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC({latencyHint:"interactive"});
      loadAll();
    }
  }
  function rememberClip(name, ab){
    var copy = ab.slice(0);
    clipRaw[name] = copy;
    if(clipUrl[name]){ try{ URL.revokeObjectURL(clipUrl[name]); }catch(e){} }
    clipUrl[name] = URL.createObjectURL(new Blob([copy], {type:"audio/mpeg"}));
  }
  function loadAll(){
    setStatus("Loading clips...");
    selectClipVoice(settings.clipVoice || "marcus");
  }
  function redecodeClips(){
    var names = Object.keys(clipRaw);
    if(!names.length){ if(ctx) loadAll(); return; }
    Promise.all(names.map(function(n){
      return decode(clipRaw[n].slice(0)).then(function(b){ buffers[n]=b; });
    })).then(function(){ loaded=true; render(); }).catch(function(e){
      loadError=e; setStatus("Could not load clips: "+e.message, true); render();
    });
  }
  // Create the context on first touch anywhere (required by iOS / Chrome autoplay rules).
  function fromRecButton(e){
    var t = e && e.target;
    return !!(t && (t.id === "recBtn" || (t.closest && t.closest("#recBtn"))));
  }
  function unlock(e){
    if(fromRecButton(e)) return;
    ensureCtx();
    if(loaded) render();

    try{ var b=ctx.createBuffer(1,1,22050), s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0);}catch(e){}

  document.addEventListener("pointerdown", unlock, true);
  document.addEventListener("touchstart", unlock, true);
  $("appVersion").textContent = VERSION;
  CLIP_VOICES.forEach(function(v){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "voicePill";
    b.dataset.voice = v.id;
    b.setAttribute("role", "radio");
    b.textContent = {marcus:"Marcus", narrator:"Narrator", announcer:"Announcer", calm:"Calm", cowboy:"Cowboy"}[v.id] || v.label;
    b.addEventListener("click", function(){ selectClipVoice(v.id); });
    $("voiceBar").appendChild(b);
  });
  createCtx(); // decode clips right away; output unlocks on first tap

  function makePreroll(seconds, type, level){
    var sr = ctx.sampleRate, n = Math.max(1, Math.floor(sr*seconds)), buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
    var fade = Math.min(Math.floor(sr*0.04), Math.floor(n/3));

      var v;
      if(type==="tone"){ v = Math.sin(2*Math.PI*440*i/sr); }
      else { // pink-ish noise (soft hiss)
        var w=Math.random()*2-1; b0=0.99765*b0+w*0.0990460; b1=0.96300*b1+w*0.2965164; b2=0.57000*b2+w*1.0526913;

  // Schedules a sequence of buffers back-to-back; returns end time.
  function schedule(list, t, out){

      if(item.gap){ t += item.gap; return; }
      var s = ctx.createBufferSource(); s.buffer = item.buf; s.connect(item.raw ? ctx.destination : out); s.start(t); t += item.buf.duration;
    });

  }
  function setAudioSession(type){
    try { if(navigator.audioSession) navigator.audioSession.type = type; } catch(e){}
  }

    setAudioSession("playback");
    var AC = window.AudioContext || window.webkitAudioContext;
    var fresh = !ctx || ctx.state === "closed";

      loaded = false;
      redecodeClips();
    }
    try { ctx.resume(); } catch(e){}
    try {
      var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();
      s.buffer = b; s.connect(ctx.destination); s.start(0);
    } catch(e){}
  }
  function restorePlaybackRoute(done){
    routeDirty = false;
    armPlayback();
    if(done) done();
  }
  var prerollBuffer = null;
  var player = document.createElement("audio");
  player.id = "callPlayer";
  player.setAttribute("playsinline", "");
  player.setAttribute("webkit-playsinline", "");
  player.preload = "auto";
  player.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none";
  document.body.appendChild(player);
  var playerGen = 0;
  var playStage = "start";
  var playWatch = null;
  var outAnalyser = null;
  var meter = {mode:"idle", buf:null, noteBuf:null, noteWhen:0, noteDur:0};
  function outputNode(){
    if(!ctx) return null;
    if(!outAnalyser || outAnalyser.context !== ctx){
      outAnalyser = ctx.createAnalyser();
      outAnalyser.fftSize = 1024;
      outAnalyser.smoothingTimeConstant = 0.4;
      outAnalyser.connect(ctx.destination);
    }
    return outAnalyser;
  }
  function analyserPeak(node){
    if(!node) return 0;
    var data = analyserPeak.buf;
    if(!data || data.length !== node.fftSize){ data = new Uint8Array(node.fftSize); analyserPeak.buf = data; }
    node.getByteTimeDomainData(data);
    var peak = 0, i, v;
    for(i=0;i<data.length;i++){
      v = Math.abs(data[i] - 128) / 128;
      if(v > peak) peak = v;
    }
    return peak;
  }
  function samplePeak(buffer, time){
    if(!buffer || time < 0) return 0;
    var data = buffer.getChannelData(0);
    var rate = buffer.sampleRate;
    var center = Math.floor(time * rate);
    if(center >= data.length) return 0;
    var win = Math.floor(rate * 0.04);
    var start = Math.max(0, center - win), end = Math.min(data.length, center + win);
    var peak = 0, i, a;
    for(i=start;i<end;i+=4){ a = data[i] < 0 ? -data[i] : data[i]; if(a > peak) peak = a; }
    return peak;
  }
  function paintMeter(){
    var bar = $("outMeterBar");
    var modeEl = $("outLevelMode");
    if(!bar) return;
    var level = 0;
    var tts = meter.mode === "tts" || (window.speechSynthesis && speechSynthesis.speaking && meter.mode === "tts");
    if(talk.live && talk.analyser){
      level = analyserPeak(talk.analyser);
      if(modeEl) modeEl.textContent = "";
    } else if(meter.mode === "tts"){
      bar.style.width = "0%";
      if(modeEl) modeEl.textContent = "TTS";
      return;
    } else if(meter.noteBuf && ctx && ctx.currentTime >= meter.noteWhen && ctx.currentTime <= meter.noteWhen + meter.noteDur + 0.05){
      level = Math.max(level, samplePeak(meter.noteBuf, ctx.currentTime - meter.noteWhen));
      if(outAnalyser) level = Math.max(level, analyserPeak(outAnalyser));
      if(modeEl) modeEl.textContent = "";
    } else if(meter.buf && player && !player.paused && player.currentTime >= 0){
      level = samplePeak(meter.buf, player.currentTime);
      if(modeEl) modeEl.textContent = "";
    } else if(modeEl) modeEl.textContent = "";
    var db = level > 0.0001 ? 20 * Math.log10(level) : -60;
    var pct = Math.max(0, Math.min(100, (db + 48) / 48 * 100));
    bar.style.width = pct + "%";
  }
  function playUrl(url, volume, next, meterBuffer){
    var gen = ++playerGen;
    if(!url){ next(); return; }
    var finished = false;
    var timer = setTimeout(function(){ finish(); }, 20000);
    function finish(){
      if(finished || gen !== playerGen) return;
      finished = true;
      clearTimeout(timer);
      player.onended = null; player.onerror = null;
      next();
    }
    player.onended = null; player.onerror = null;
    try { player.pause(); } catch(e){}
    player.volume = Math.max(0, Math.min(1, volume == null ? settings.vol/100 : volume));
    player.onended = function(){ if(gen === playerGen) finish(); };
    player.onerror = function(){
      if(gen !== playerGen) return;

      setStatus("Play error: " + (media && (media.message || media.code) || "media"), true);

    else { try { player.currentTime = 0; } catch(e){} }

  function makePrerollUrl(){
    if(settings.prerollType === "off") return "";

    var n = Math.max(1, Math.floor(sr * seconds)), d = new Float32Array(n);
    var fade = Math.min(Math.floor(sr * 0.04), Math.floor(n / 3));
    var b0=0, b1=0, b2=0, i, v, env, w;
    for(i=0;i<n;i++){

      else {
        w = Math.random()*2-1;

    if(settings.wake && document.visibilityState==="visible"){ navigator.wakeLock.request("screen").then(function(l){wakeLock=l;}).catch(function(){}); }
    else if(wakeLock){ wakeLock.release().catch(function(){}); wakeLock=null; }
  }
  document.addEventListener("visibilitychange", function(){ requestWake(); if(ctx && document.visibilityState==="visible" && ctx.state!=="running") ctx.resume(); });
  document.addEventListener("click", function once(){ requestWake(); document.removeEventListener("click", once); });

  // ---------- Offline ----------
  function showUpdateBanner(){
    var btn = $("updateBtn");
    if(!btn) return;
    btn.hidden = false;
    btn.textContent = "Update";
  }
  function reloadForUpdate(key){
    try {
      if(sessionStorage.getItem("pc-reload") === key) return;
      sessionStorage.setItem("pc-reload", key);
    } catch(e){}
    location.reload();
  }
  function checkNetworkVersion(){
    fetch("version.js?ts=" + Date.now(), {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("offline");
      return r.text();
    }).then(function(text){
      var m = /PITCHCALLER_VERSION\s*=\s*"([^"]+)"/.exec(text || "");
      if(!m || !m[1] || m[1] === VERSION) return;
      showUpdateBanner();
      reloadForUpdate("ver:" + m[1]);
    }).catch(function(){});
  }
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    try { if(sessionStorage.getItem("pc-reload")) setTimeout(function(){ try{ sessionStorage.removeItem("pc-reload"); }catch(e){} }, 4000); } catch(e){}
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(!hadController){ hadController = true; return; }
      showUpdateBanner();
      reloadForUpdate("sw");
    });
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(function(reg){
      reg.update().catch(function(){});
      document.addEventListener("visibilitychange", function(){
        if(document.visibilityState === "visible"){
          reg.update().catch(function(){});
          checkNetworkVersion();
        }
      });
    }).catch(function(e){ console.warn("SW failed", e); });
    checkNetworkVersion();
  }
  render();
})();
</script>
</body>
</html>
